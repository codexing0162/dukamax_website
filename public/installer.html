<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dukamax APK Installer</title>
    <style>body{font-family:system-ui,Segoe UI,Roboto,Arial;padding:24px;max-width:720px;margin:auto}</style>
  </head>
  <body>
    <h1>Dukamax — Secure Installer</h1>
    <p>This page requests a one-time download link and starts the APK download.</p>

    <form id="frm">
      <label>Username (for logging):<br/><input id="user" name="user" /></label><br/><br/>
      <label>Device fingerprint (optional):<br/><input id="fingerprint" name="fingerprint" placeholder="eg. device-identifier or safetyNet token"/></label><br/><br/>
      <label>Install password (server-side secret):<br/><input id="password" name="password" type="password"/></label><br/><br/>
      <button type="submit">Request installer</button>
    </form>

    <div id="status"></div>

    <script>
      const form = document.getElementById('frm');
      const status = document.getElementById('status');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        status.textContent = 'Requesting token...';
        const user = document.getElementById('user').value;
        const fingerprint = document.getElementById('fingerprint').value;
        const password = document.getElementById('password').value;
        try {
          const resp = await fetch('/request-install', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-install-password': password
            },
            body: JSON.stringify({ user, deviceFingerprint: fingerprint })
          });
          if (!resp.ok) {
            const err = await resp.json().catch(()=>({error:'unknown'}));
            status.textContent = 'Error: ' + (err.error || resp.statusText);
            return;
          }
          const j = await resp.json();
          status.textContent = 'Starting download...';
          // append fingerprint to download URL if provided
          let url = j.downloadUrl;
          if (fingerprint) url += '&fingerprint=' + encodeURIComponent(fingerprint);
          // create anchor and click it to trigger download
          const a = document.createElement('a');
          a.href = url;
          a.download = '';
          document.body.appendChild(a);
          a.click();
          a.remove();
          status.textContent = 'If the download did not start, open the link: ' + url;
        } catch (err) {
          console.error(err);
          status.textContent = 'Request failed';
        }
      });
    </script>
  </body>
  </html>
